name: Actualizar Monitor Financiero 24/7

on:
  schedule:
    # 1. Actualización Principal Diaria: 18:30 ART (21:30 UTC) Lunes a Viernes
    - cron: '30 21 * * 1-5'
    # 2. Respaldo 1 (FCI y Cierres Tardíos): 21:00 ART (00:00 UTC) Martes a Sábado
    - cron: '0 0 * * 2-6'
    # 3. Respaldo 2 (Consolidación Nocturna): 23:30 ART (02:30 UTC) Martes a Sábado
    - cron: '30 2 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-financial-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Financial Data Updater
        env:
          PYTHONPATH: '.'
          TZ: 'America/Argentina/Buenos_Aires'
        run: |
          python actualizar_monitor.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update financial data [skip ci]" && git push)
