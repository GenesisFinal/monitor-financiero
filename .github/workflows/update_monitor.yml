name: Actualizar Monitor Financiero 24/7

on:
  schedule:
    # 1. Cierre Principal de Mercados: 18:37 ART (21:37 UTC) Lunes a Viernes
    - cron: '37 21 * * 1-5'
    # 2. Respaldo Cierres Tardíos y FCI: 20:17 ART (23:17 UTC) Lunes a Viernes
    - cron: '17 23 * * 1-5'
    # 3. Respaldo Nocturno Consolidado: 21:43 ART (00:43 UTC) Martes a Sábado
    - cron: '43 0 * * 2-6'
    # 4. Respaldo Final Nocturno: 23:22 ART (02:22 UTC) Martes a Sábado
    - cron: '22 2 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-financial-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Financial Data Updater
        env:
          PYTHONPATH: '.'
          TZ: 'America/Argentina/Buenos_Aires'
        run: |
          python actualizar_monitor.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update financial data [skip ci]" && git push)
